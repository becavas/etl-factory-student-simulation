bundle:
  name: enterprise_fabric_engineering_baseline
  databricks_cli_version: "1.12.*"

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  policy_id:
    description: ID de la compute policy aprobada para sandbox.
  spark_version:
    description: Databricks Runtime LTS permitido por la policy.
  node_type_id:
    description: Node type pequeño permitido por la policy.

targets:
  sandbox:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
