bundle:
  name: retail_orchestration
  databricks_cli_version: "1.12.*"

include:
  - resources/*.yml

variables:
  runtime_sp_client_id:
    description: Application ID del service principal runtime del ambiente.
    default: __required_in_shared_target__
  operator_group:
    description: Grupo operador autorizado en el ambiente compartido.
    default: __required_in_shared_target__
  notification_destination_id:
    description: ID no secreto del system destination administrado.
    default: __required_in_shared_target__
  git_sha:
    description: Commit exacto desplegado por CI/CD.
    default: local-uncommitted
  pedidos_job_name:
    description: Effective deployed name of retail pedidos E2E job
    default: "[dev ${workspace.current_user.short_name}] retail-pedidos-e2e"
  clientes_job_name:
    description: Effective deployed name of retail clientes E2E job
    default: "[dev ${workspace.current_user.short_name}] retail-clientes-e2e"
  productos_job_name:
    description: Effective deployed name of retail productos E2E job
    default: "[dev ${workspace.current_user.short_name}] retail-productos-e2e"
  ventas_job_name:
    description: Effective deployed name of retail ventas Gold job
    default: "[dev ${workspace.current_user.short_name}] retail-ventas-gold"

  pedidos_job_id:
    description: Resolved workspace ID for pedidos
    lookup:
      job: ${var.pedidos_job_name}
  clientes_job_id:
    description: Resolved workspace ID for clientes
    lookup:
      job: ${var.clientes_job_name}
  productos_job_id:
    description: Resolved workspace ID for productos
    lookup:
      job: ${var.productos_job_name}
  ventas_job_id:
    description: Resolved workspace ID for ventas
    lookup:
      job: ${var.ventas_job_name}

targets:
  sandbox:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  dev:
    mode: production
    git:
      branch: main
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.runtime_sp_client_id}
    permissions:
      - group_name: ${var.operator_group}
        level: CAN_RUN
    presets:
      tags:
        deployed_commit: ${var.git_sha}
    variables:
      pedidos_job_name: retail-pedidos-e2e
      clientes_job_name: retail-clientes-e2e
      productos_job_name: retail-productos-e2e
      ventas_job_name: retail-ventas-gold

  certi:
    mode: production
    git:
      branch: main
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.runtime_sp_client_id}
    permissions:
      - group_name: ${var.operator_group}
        level: CAN_RUN
    presets:
      tags:
        deployed_commit: ${var.git_sha}
    variables:
      pedidos_job_name: retail-pedidos-e2e
      clientes_job_name: retail-clientes-e2e
      productos_job_name: retail-productos-e2e
      ventas_job_name: retail-ventas-gold
    resources:
      jobs:
        retail_domain_e2e_job:
          permissions:
            - group_name: ${var.operator_group}
              level: CAN_MANAGE_RUN
          schedule:
            quartz_cron_expression: "0 0 2 * * ?"
            timezone_id: America/Lima
            pause_status: PAUSED
          parameters:
            - name: batch_id
              default: "{{job.trigger.time.iso_date}}"
            - name: snapshot_mode
              default: INCREMENTAL
            - name: aggregate_mode
              default: INCREMENTAL
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 60
          webhook_notifications:
            on_failure:
              - id: ${var.notification_destination_id}
            on_duration_warning_threshold_exceeded:
              - id: ${var.notification_destination_id}
          notification_settings:
            no_alert_for_skipped_runs: false
            no_alert_for_canceled_runs: false

  prod:
    mode: production
    git:
      branch: main
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.runtime_sp_client_id}
    permissions:
      - group_name: ${var.operator_group}
        level: CAN_RUN
    presets:
      tags:
        deployed_commit: ${var.git_sha}
    variables:
      pedidos_job_name: retail-pedidos-e2e
      clientes_job_name: retail-clientes-e2e
      productos_job_name: retail-productos-e2e
      ventas_job_name: retail-ventas-gold
    resources:
      jobs:
        retail_domain_e2e_job:
          permissions:
            - group_name: ${var.operator_group}
              level: CAN_MANAGE_RUN
          schedule:
            quartz_cron_expression: "0 0 2 * * ?"
            timezone_id: America/Lima
            pause_status: PAUSED
          parameters:
            - name: batch_id
              default: "{{job.trigger.time.iso_date}}"
            - name: snapshot_mode
              default: INCREMENTAL
            - name: aggregate_mode
              default: INCREMENTAL
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 7200
          webhook_notifications:
            on_failure:
              - id: ${var.notification_destination_id}
            on_duration_warning_threshold_exceeded:
              - id: ${var.notification_destination_id}
          notification_settings:
            no_alert_for_skipped_runs: false
            no_alert_for_canceled_runs: false
