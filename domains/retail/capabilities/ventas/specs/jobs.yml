spec_version: 1
kind: bundle_jobs

metadata:
  domain: retail
  capability: ventas

package:
  name: enterprise-fabric
  wheel_path: ../../../../../dist/*.whl

jobs:
  - key: ventas_gold_job
    name: retail-ventas-gold
    layer: gold
    max_concurrent_runs: 1
    parameters:
      batch_id: gold_initial_001
      snapshot_mode: INCREMENTAL
      aggregate_mode: INCREMENTAL
    clusters:
      - key: ventas_shared_job_compute
        profile: classic_single_user_small
        tags:
          layer: gold
          policy_profile: baseline
          target_table: fact_ventas
          workload: gold
    tasks:
      - key: publish_ventas_dimensions
        cluster_key: ventas_shared_job_compute
        timeout_seconds: 1800
        retry:
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: false
        wheel:
          entry_point: ventas-dimensions
          named_parameters:
            catalog: ${var.catalog}
            batch_id: "{{job.parameters.batch_id}}"
            snapshot_mode: "{{job.parameters.snapshot_mode}}"
      - key: publish_ventas_fact
        depends_on:
          - publish_ventas_dimensions
        cluster_key: ventas_shared_job_compute
        timeout_seconds: 1800
        retry:
          max_retries: 0
        wheel:
          entry_point: ventas-fact
          named_parameters:
            catalog: ${var.catalog}
            batch_id: "{{job.parameters.batch_id}}"
      - key: publish_ventas_daily_kpi
        depends_on:
          - publish_ventas_fact
        cluster_key: ventas_shared_job_compute
        timeout_seconds: 1800
        retry:
          max_retries: 0
        wheel:
          entry_point: ventas-daily-kpi
          named_parameters:
            catalog: ${var.catalog}
            batch_id: "{{job.parameters.batch_id}}"
            aggregate_mode: "{{job.parameters.aggregate_mode}}"
