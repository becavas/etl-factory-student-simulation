name: pull-request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  engineering-quality:
    name: engineering-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Java for local PySpark tests
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and quality tools
        # pyspark==3.5.2 refleja DBR 16.4 LTS y es dependencia de tests, no del wheel
        run: |
          python -m pip install --disable-pip-version-check \
            build==1.5.0 \
            hatchling==1.32.0 \
            pytest==9.1.1 \
            ruff==0.16.3 \
            pyspark==3.5.2 \
            delta-spark==3.1.0 \
            pyyaml==6.0.3 \
            jsonschema==4.26.0
          python -m pip install --no-deps .


      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Run unit tests
        run: python -m pytest

      - name: Check generated Bundle resources
        run: python -m tools.bundle_generator generate --all --check

      - name: Detect affected Bundles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --no-renames --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA" \
            > /tmp/changed-paths.txt
          python scripts/affected_bundles.py \
            < /tmp/changed-paths.txt \
            > /tmp/affected-bundles.txt
          echo "Affected Bundles:"
          sed 's/^/- /' /tmp/affected-bundles.txt

      - name: Check affected generated resources
        run: |
          while IFS= read -r bundle_root; do
            [ -z "$bundle_root" ] && continue
            python -m tools.bundle_generator generate \
              --spec "$bundle_root/specs/jobs.yml" \
              --check
          done < /tmp/affected-bundles.txt

      - name: Build wheel
        run: python -m build --wheel

      - name: Inspect wheel contract
        run: python scripts/inspect_wheel.py dist/*.whl
