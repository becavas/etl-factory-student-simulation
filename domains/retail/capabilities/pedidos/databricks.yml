bundle:
  name: retail_pedidos
  databricks_cli_version: "1.12.*"

include:
  - resources/*.generated.yml

sync:
  paths:
    - ../../../../src
    - .

artifacts:
  default:
    type: whl
    build: python scripts/prepare_bundle_artifact.py
    path: ../../../..

variables:
  runtime_sp_client_id:
    description: Application ID del service principal runtime del ambiente.
    default: __required_in_shared_target__
  operator_group:
    description: Grupo operador autorizado en el ambiente compartido.
    default: __required_in_shared_target__
  git_sha:
    description: Commit exacto desplegado por CI/CD.
    default: local-uncommitted
  catalog:
    description: Catálogo del dominio retail para el ambiente.
  source_volume_path:
    description: Ruta del Volume gobernado de pedidos.
  policy_id:
    description: ID de la compute policy aprobada.
  spark_version:
    description: DBR 16.4 LTS aprobado por Data Platform.
    default: 16.4.x-scala2.12
  node_type_id:
    description: Node type pequeño permitido por la policy.

targets:
  sandbox:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  dev:
    mode: production
    git:
      branch: main
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.runtime_sp_client_id}
    permissions:
      - group_name: ${var.operator_group}
        level: CAN_RUN
    presets:
      tags:
        deployed_commit: ${var.git_sha}
    variables:
      catalog: retail_dev
      source_volume_path: /Volumes/retail_dev/landing/pedidos_source
    resources:
      jobs:
        pedidos_e2e_job:
          permissions:
            - service_principal_name: ${var.runtime_sp_client_id}
              level: CAN_MANAGE_RUN

  certi:
    mode: production
    git:
      branch: main
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.runtime_sp_client_id}
    permissions:
      - group_name: ${var.operator_group}
        level: CAN_RUN
    presets:
      tags:
        deployed_commit: ${var.git_sha}
    variables:
      catalog: retail_certi
      source_volume_path: /Volumes/retail_certi/landing/pedidos_source
    resources:
      jobs:
        pedidos_e2e_job:
          permissions:
            - service_principal_name: ${var.runtime_sp_client_id}
              level: CAN_MANAGE_RUN

  prod:
    mode: production
    git:
      branch: main
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.runtime_sp_client_id}
    permissions:
      - group_name: ${var.operator_group}
        level: CAN_RUN
    presets:
      tags:
        deployed_commit: ${var.git_sha}
    variables:
      catalog: retail_prod
      source_volume_path: /Volumes/retail_prod/landing/pedidos_source
    resources:
      jobs:
        pedidos_e2e_job:
          permissions:
            - service_principal_name: ${var.runtime_sp_client_id}
              level: CAN_MANAGE_RUN
