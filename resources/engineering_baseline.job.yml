resources:
  jobs:
    engineering_baseline_job:
      name: engineering-baseline-wheel-smoke
      max_concurrent_runs: 1
      tags:
        domain: platform
        capability: engineering_baseline
        environment: ${bundle.target}
        layer: none
        managed_by: bundle
      job_clusters:
        - job_cluster_key: governed_job_compute
          new_cluster:
            policy_id: ${var.policy_id}
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            data_security_mode: SINGLE_USER
            num_workers: 1
            custom_tags:
              domain: platform
              capability: engineering_baseline
              environment: ${bundle.target}
              layer: none
              managed_by: bundle
              policy_profile: baseline
              target_table: none
              generated_by: bundle
      tasks:
        - task_key: execute_installed_wheel
          job_cluster_key: governed_job_compute
          python_wheel_task:
            package_name: enterprise-fabric
            entry_point: engineering-baseline
          libraries:
            - whl: ../dist/*.whl
